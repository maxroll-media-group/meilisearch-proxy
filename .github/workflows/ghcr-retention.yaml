name: GHCR Retention

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only report versions that would be deleted
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: snok/container-retention-policy@v3.1.0
        with:
          account: maxroll-media-group
          token: ${{ secrets.GITHUB_TOKEN }}
          image-names: meilisearch-proxy
          # Every release carries its v*, sha-* and latest tags on the same
          # package version, and the action only deletes a version when all of
          # its tags match a filter. List all three patterns here.
          image-tags: 'v* sha-* latest'
          # Keep the 5 most recent releases, so rollbacks have an image to pull.
          keep-n-most-recent: 5
          cut-off: 1s
          timestamp-to-use: created_at
          dry-run: ${{ github.event_name == 'schedule' && 'false' || inputs.dry-run }}