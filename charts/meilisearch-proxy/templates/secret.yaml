{{- if not .Values.existingSecret }}
{{- /* Earlier revisions read .Values.health.*; keep those overrides working. */}}
{{- $legacy := .Values.health | default dict }}
{{- $health := .Values.proxy.healthcheck }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "meilisearch-proxy.fullname" . }}-secret
  labels:
    app: {{ include "meilisearch-proxy.name" . }}
    chart: {{ include "meilisearch-proxy.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
type: Opaque
data:
  MEILISEARCH_HOST: {{ .Values.meilisearch.url | b64enc | quote }}
  MEILISEARCH_MASTER_KEY: {{ "" | b64enc | quote }}
  PROXY_MASTER_KEY_OVERRIDE: {{ .Values.proxy.overrideProxyKey | quote | b64enc | quote }}
  PROXY_MASTER_KEY: {{ "" | b64enc | quote }}
  MEILISEARCH_PUBLIC_KEY_OVERRIDE: {{ "true" | b64enc | quote }}
  CACHE_ENGINE: {{ .Values.proxy.cacheEngine | b64enc | quote }}
  CACHE_URL: {{ .Values.proxy.masterKey | b64enc | quote }}
  CACHE_TTL: {{ .Values.proxy.cacheDuration | b64enc | quote }}
  PORT: {{ .Values.proxy.port | b64enc | quote }}
  LOG_LEVEL: {{ .Values.proxy.logLevel | b64enc | quote }}
  PROXY_PURGE_TOKEN: {{ .Values.proxy.purgeToken | b64enc | quote }}
  HEALTH_MAX_FAILURES: {{ (ternary $legacy.maxFailures $health.maxFailures (hasKey $legacy "maxFailures")) | toString | b64enc | quote }}
  HEALTH_MIN_SUCCESSES: {{ (ternary $legacy.minSuccesses $health.minSuccesses (hasKey $legacy "minSuccesses")) | toString | b64enc | quote }}
  HEALTH_EXIT_ON_MAX_FAILURES: {{ (ternary $legacy.exitOnFailure $health.exitOnFailure (hasKey $legacy "exitOnFailure")) | toString | b64enc | quote }}

{{- end }}
