{{- if not .Values.existingSecret }}
{{- /* Precedence: proxy.healthcheck.* > .Values.health.* (legacy) > binary defaults. */}}
{{- $legacy := .Values.health | default dict }}
{{- $health := .Values.proxy.healthcheck | default dict }}
{{- $maxFailures := 5 }}
{{- $minSuccesses := 2 }}
{{- $exitOnFailure := true }}
{{- if hasKey $health "maxFailures" }}{{ $maxFailures = $health.maxFailures }}{{ else if hasKey $legacy "maxFailures" }}{{ $maxFailures = $legacy.maxFailures }}{{ end }}
{{- if hasKey $health "minSuccesses" }}{{ $minSuccesses = $health.minSuccesses }}{{ else if hasKey $legacy "minSuccesses" }}{{ $minSuccesses = $legacy.minSuccesses }}{{ end }}
{{- if hasKey $health "exitOnFailure" }}{{ $exitOnFailure = $health.exitOnFailure }}{{ else if hasKey $legacy "exitOnFailure" }}{{ $exitOnFailure = $legacy.exitOnFailure }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "meilisearch-proxy.fullname" . }}-secret
  labels:
    app: {{ include "meilisearch-proxy.name" . }}
    chart: {{ include "meilisearch-proxy.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
type: Opaque
data:
  MEILISEARCH_HOST: {{ .Values.meilisearch.url | b64enc | quote }}
  MEILISEARCH_MASTER_KEY: {{ "" | b64enc | quote }}
  PROXY_MASTER_KEY_OVERRIDE: {{ .Values.proxy.overrideProxyKey | quote | b64enc | quote }}
  PROXY_MASTER_KEY: {{ "" | b64enc | quote }}
  MEILISEARCH_PUBLIC_KEY_OVERRIDE: {{ "true" | b64enc | quote }}
  CACHE_ENGINE: {{ .Values.proxy.cacheEngine | b64enc | quote }}
  CACHE_URL: {{ .Values.proxy.masterKey | b64enc | quote }}
  CACHE_TTL: {{ .Values.proxy.cacheDuration | b64enc | quote }}
  PORT: {{ .Values.proxy.port | b64enc | quote }}
  LOG_LEVEL: {{ .Values.proxy.logLevel | b64enc | quote }}
  PROXY_PURGE_TOKEN: {{ .Values.proxy.purgeToken | b64enc | quote }}
  HEALTH_MAX_FAILURES: {{ $maxFailures | toString | b64enc | quote }}
  HEALTH_MIN_SUCCESSES: {{ $minSuccesses | toString | b64enc | quote }}
  HEALTH_EXIT_ON_MAX_FAILURES: {{ $exitOnFailure | toString | b64enc | quote }}

{{- end }}
