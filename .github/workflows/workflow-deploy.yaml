name: Build and Deploy

on:
  push:
    branches:
      - '*'
    tags:
      - '*'
env:
  ## HARBOR
  IMAGE_NAME: meilisearch-proxy
  HARBOR_FULL_IMAGE: registry.maxroll.gg/library/meilisearch-proxy
  ### ECR
  ECR_FULL_IMAGE: 019918971229.dkr.ecr.us-east-1.amazonaws.com/maxroll-ecr-dev/meilisearch-proxy
  AWS_REGION: us-east-1
  AWS_CREDS: arn:aws:iam::019918971229:role/maxroll-githubaction-auth-role
  # --- IMPORTANT: Configure these for your ECS deployment ---
  ECS_CLUSTER_NAME: maxroll-private-dev-cluster # Replace with your ECS Cluster Name
  ECS_SERVICE_NAME: maxroll-frontend-dev-ecs-service  # Replace with your ECS Service Name
  ECS_TASK_DEFINITION_FILE: config/task-definition.json # Path to your task definition file
  CONTAINER_NAME_IN_TASK_DEF: meilisearch-proxy # Name of the container in your task definition to update

permissions:
  actions: write
  checks: write
  contents: write
  deployments: write
  discussions: write
  id-token: write
  issues: write
  packages: write
  pages: write
  pull-requests: write
  repository-projects: write
  security-events: write
  statuses: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup Go 1.22.x
        uses: actions/setup-go@v5
        with:
          # Semantic version range syntax or exact version of Go
          go-version: '1.22.x'

      - name: Install dependencies
        run: |
          go mod download

      - name: Install Ginkgo
        run: |
          go install github.com/onsi/ginkgo/v2/ginkgo@latest

      - name: Run tests
        run: |
          ginkgo -r -v

  build-to-ecr:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: echo environment
        run: |
          echo "Environment: ${{ vars.ENV }}"
          echo "Image name: ${{ env.ECR_FULL_IMAGE }}"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.ECR_FULL_IMAGE }}
          tags: |
            type=raw,value=latest,enable=true
            type=semver,pattern={{raw}},enable=true
            type=sha

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: ${{ env.AWS_CREDS }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v2

      - uses: docker/build-push-action@v6
        with:
          build-args: GITHUB_PACKAGE_TOKEN=${{ secrets.GITHUB_TOKEN }}
          context: .
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

